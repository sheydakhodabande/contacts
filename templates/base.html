<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            دفترچه مخاطبین
        {% endblock %}
    </title>

    <style>
        /* =====================================================
           Contact Book - Base Template
           Modern RTL UI
        ===================================================== */

        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');

        /* =========================
           Root Variables
        ========================== */
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #eef2ff;

            --secondary: #7c3aed;

            --text: #172033;
            --text-soft: #64748b;
            --text-muted: #94a3b8;

            --background: #f5f7fb;
            --surface: #ffffff;
            --surface-soft: #f8fafc;

            --border: #e5e7eb;
            --border-light: #eef0f4;

            --success: #10b981;
            --danger: #ef4444;

            --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 12px 35px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.10);

            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;

            --container: 1180px;
        }

        /* =========================
           Reset
        ========================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            font-family: "Vazirmatn", Tahoma, Arial, sans-serif;
            font-size: 15px;
            line-height: 1.8;

            color: var(--text);
            background: var(--background);

            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            z-index: -2;

            top: -180px;
            right: -180px;

            width: 450px;
            height: 450px;

            background: rgba(99, 102, 241, 0.08);
            border-radius: 50%;

            filter: blur(5px);
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            z-index: -2;

            bottom: -220px;
            left: -180px;

            width: 500px;
            height: 500px;

            background: rgba(124, 58, 237, 0.06);
            border-radius: 50%;

            filter: blur(10px);
            pointer-events: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        button {
            border: none;
        }

        /* =========================
           Container
        ========================== */
        .container {
            width: min(var(--container), 92%);
            margin: 0 auto;
        }

        /* =========================
           Header / Navbar
        ========================== */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 1000;

            width: 100%;

            background: rgba(255, 255, 255, 0.90);
            border-bottom: 1px solid rgba(226, 232, 240, 0.85);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .navbar {
            min-height: 78px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 30px;
        }

        /* =========================
           Brand
        ========================== */
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;

            color: var(--text);

            transition: opacity 0.2s ease;
        }

        .brand:hover {
            opacity: 0.88;
        }

        .brand-icon {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;
            background: linear-gradient(
                135deg,
                var(--primary),
                var(--secondary)
            );

            border-radius: 13px;

            box-shadow:
                0 8px 20px rgba(79, 70, 229, 0.22);
        }

        .brand-icon svg {
            width: 24px;
            height: 24px;
        }

        .brand-text {
            display: flex;
            flex-direction: column;

            line-height: 1.35;
        }

        .brand-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text);
        }

        .brand-subtitle {
            margin-top: 2px;

            font-size: 0.72rem;
            font-weight: 400;

            color: var(--text-muted);
        }

        /* =========================
           Navigation
        ========================== */
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 7px;

            margin-right: auto;
        }

        .nav-link {
            position: relative;

            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 9px 14px;

            color: var(--text-soft);
            font-size: 0.9rem;
            font-weight: 600;

            border-radius: 10px;

            transition:
                color 0.2s ease,
                background 0.2s ease;
        }

        .nav-link svg {
            width: 18px;
            height: 18px;
        }

        .nav-link:hover {
            color: var(--primary);
            background: var(--primary-light);
        }

        .nav-link.active {
            color: var(--primary);
            background: var(--primary-light);
        }

        /* =========================
           Add Contact Button
        ========================== */
        .add-contact-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            min-height: 43px;
            padding: 9px 17px;

            color: #ffffff;

            background: linear-gradient(
                135deg,
                var(--primary),
                var(--secondary)
            );

            border-radius: 11px;

            font-size: 0.88rem;
            font-weight: 700;

            box-shadow:
                0 7px 18px rgba(79, 70, 229, 0.18);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .add-contact-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 11px 25px rgba(79, 70, 229, 0.25);

            filter: brightness(1.03);
        }

        .add-contact-btn svg {
            width: 18px;
            height: 18px;
        }

        /* =========================
           Main
        ========================== */
        main {
            flex: 1;

            padding: 42px 0 65px;

            position: relative;
        }

        .main-content {
            position: relative;
        }

        /* =========================
           Page Hero / Title
        ========================== */
        .page-header {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 25px;

            margin-bottom: 28px;
            padding: 28px 30px;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    rgba(79, 70, 229, 0.96),
                    rgba(109, 40, 217, 0.94)
                );

            border-radius: var(--radius-lg);

            box-shadow:
                0 18px 40px rgba(79, 70, 229, 0.16);
        }

        .page-header::before {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            top: -120px;
            left: -50px;

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
        }

        .page-header::after {
            content: "";

            position: absolute;

            width: 160px;
            height: 160px;

            bottom: -110px;
            right: 30%;

            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 50%;
        }

        .page-header-content {
            position: relative;
            z-index: 2;
        }

        .page-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            margin-bottom: 7px;

            color: rgba(255, 255, 255, 0.75);

            font-size: 0.76rem;
            font-weight: 600;
        }

        .page-label-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;
            background: #ffffff;
        }

        .page-title {
            color: #ffffff;

            font-size: clamp(1.45rem, 3vw, 2rem);
            font-weight: 800;

            letter-spacing: -0.5px;
        }

        .page-description {
            max-width: 620px;

            margin-top: 5px;

            color: rgba(255, 255, 255, 0.78);

            font-size: 0.88rem;
        }

        .page-header-icon {
            position: relative;
            z-index: 2;

            width: 75px;
            height: 75px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            color: rgba(255, 255, 255, 0.92);

            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 20px;
        }

        .page-header-icon svg {
            width: 38px;
            height: 38px;
        }

        /* =========================
           Search Area
        ========================== */
        .search-section {
            margin-bottom: 28px;
            padding: 18px;

            background: rgba(255, 255, 255, 0.80);

            border: 1px solid var(--border);
            border-radius: var(--radius-md);

            box-shadow: var(--shadow-sm);
        }

        .search-box {
            position: relative;

            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            right: 15px;

            width: 19px;
            height: 19px;

            color: var(--text-muted);

            pointer-events: none;
        }

        .search-input {
            width: 100%;

            min-height: 48px;

            padding: 10px 46px 10px 15px;

            color: var(--text);

            background: var(--surface-soft);

            border: 1px solid var(--border);
            border-radius: 11px;

            outline: none;

            font-size: 0.9rem;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            background: #ffffff;
            border-color: rgba(79, 70, 229, 0.5);

            box-shadow:
                0 0 0 4px rgba(79, 70, 229, 0.08);
        }

        /* =========================
           Content Area
        ========================== */
        .content-section {
            width: 100%;
        }

        /* =========================
           Contact Grid
        ========================== */
        .contacts-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 18px;
        }

        /* =========================
           Contact Card
        ========================== */
        .contact-card {
            position: relative;

            display: flex;
            flex-direction: column;

            padding: 22px;

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: var(--radius-md);

            box-shadow: var(--shadow-sm);

            overflow: hidden;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        .contact-card::before {
            content: "";

            position: absolute;

            top: 0;
            right: 0;

            width: 100%;
            height: 3px;

            background: linear-gradient(
                90deg,
                var(--primary),
                var(--secondary)
            );

            opacity: 0;

            transition: opacity 0.25s ease;
        }

        .contact-card:hover {
            transform: translateY(-4px);

            border-color: rgba(79, 70, 229, 0.16);

            box-shadow: var(--shadow-md);
        }

        .contact-card:hover::before {
            opacity: 1;
        }

        .contact-card-top {
            display: flex;
            align-items: center;

            gap: 14px;

            margin-bottom: 18px;
        }

        /* =========================
           Avatar
        ========================== */
        .contact-avatar {
            width: 52px;
            height: 52px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--primary);

            background: var(--primary-light);

            border: 1px solid rgba(79, 70, 229, 0.08);

            border-radius: 14px;

            font-size: 1.1rem;
            font-weight: 800;
        }

        .contact-avatar svg {
            width: 25px;
            height: 25px;
        }

        .contact-info {
            min-width: 0;
        }

        .contact-name {
            margin-bottom: 2px;

            color: var(--text);

            font-size: 1rem;
            font-weight: 750;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-role {
            color: var(--text-muted);

            font-size: 0.76rem;
        }

        /* =========================
           Contact Details
        ========================== */
        .contact-details {
            display: flex;
            flex-direction: column;

            gap: 9px;

            padding-top: 16px;

            border-top: 1px solid var(--border-light);
        }

        .contact-detail {
            display: flex;
            align-items: center;
            gap: 9px;

            color: var(--text-soft);

            font-size: 0.82rem;
        }

        .contact-detail-icon {
            width: 31px;
            height: 31px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            color: var(--primary);

            background: var(--surface-soft);

            border: 1px solid var(--border-light);
            border-radius: 9px;
        }

        .contact-detail-icon svg {
            width: 15px;
            height: 15px;
        }

        .contact-detail span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* =========================
           Empty State
        ========================== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-height: 280px;

            padding: 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.75);

            border: 1px dashed #d7dce5;
            border-radius: var(--radius-md);
        }

        .empty-icon {
            width: 64px;
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 15px;

            color: var(--primary);

            background: var(--primary-light);

            border-radius: 18px;
        }

        .empty-icon svg {
            width: 30px;
            height: 30px;
        }

        .empty-title {
            margin-bottom: 5px;

            color: var(--text);

            font-size: 1rem;
            font-weight: 750;
        }

        .empty-description {
            max-width: 400px;

            color: var(--text-muted);

            font-size: 0.82rem;
        }

        /* =========================
           Generic Card
        ========================== */
        .card {
            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: var(--radius-md);

            box-shadow: var(--shadow-sm);

            padding: 25px;
        }

        /* =========================
           Forms
        ========================== */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;

            margin-bottom: 7px;

            color: var(--text);

            font-size: 0.84rem;
            font-weight: 700;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;

            padding: 11px 13px;

            color: var(--text);

            background: #ffffff;

            border: 1px solid var(--border);
            border-radius: 10px;

            outline: none;

            font-size: 0.88rem;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-input,
        .form-select {
            min-height: 45px;
        }

        .form-textarea {
            min-height: 110px;

            resize: vertical;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 4px rgba(79, 70, 229, 0.08);
        }

        /* =========================
           Generic Buttons
        ========================== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            min-height: 43px;

            padding: 9px 17px;

            border-radius: 10px;

            font-size: 0.85rem;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .btn-primary {
            color: #ffffff;

            background: var(--primary);

            box-shadow:
                0 6px 16px rgba(79, 70, 229, 0.17);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-secondary {
            color: var(--text-soft);

            background: var(--surface-soft);

            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            color: var(--primary);
            border-color: rgba(79, 70, 229, 0.18);
            background: var(--primary-light);
        }

        .btn-danger {
            color: #ffffff;
            background: var(--danger);
        }

        /* =========================
           Footer
        ========================== */
        .site-footer {
            margin-top: auto;

            background: #ffffff;

            border-top: 1px solid var(--border);
        }

        .footer-content {
            min-height: 78px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .footer-brand {
            display: flex;
            align-items: center;
            gap: 9px;

            color: var(--text);

            font-size: 0.82rem;
            font-weight: 700;
        }

        .footer-brand-icon {
            width: 30px;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--primary);
            background: var(--primary-light);

            border-radius: 8px;
        }

        .footer-brand-icon svg {
            width: 16px;
            height: 16px;
        }

        .footer-text {
            color: var(--text-muted);

            font-size: 0.75rem;
        }

        .footer-copy {
            color: var(--text-muted);

            font-size: 0.72rem;
        }

        /* =========================
           Responsive - Tablet
        ========================== */
        @media (max-width: 950px) {
            .contacts-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .nav-menu {
                display: none;
            }

            .page-header {
                padding: 25px;
            }
        }

        /* =========================
           Responsive - Mobile
        ========================== */
        @media (max-width: 650px) {
            .container {
                width: 91%;
            }

            .site-header {
                position: relative;
            }

            .navbar {
                min-height: 70px;
            }

            .brand-icon {
                width: 42px;
                height: 42px;
            }

            .brand-subtitle {
                display: none;
            }

            .add-contact-btn {
                width: 43px;
                padding: 0;

                font-size: 0;
            }

            .add-contact-btn svg {
                width: 19px;
                height: 19px;
            }

            main {
                padding: 25px 0 45px;
            }

            .page-header {
                align-items: flex-start;

                padding: 23px;

                border-radius: 17px;
            }

            .page-header-icon {
                width: 55px;
                height: 55px;

                border-radius: 15px;
            }

            .page-header-icon svg {
                width: 28px;
                height: 28px;
            }

            .page-description {
                font-size: 0.78rem;
            }

            .search-section {
                padding: 12px;
            }

            .contacts-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .contact-card {
                padding: 19px;
            }

            .footer-content {
                min-height: 70px;

                flex-direction: column;
                justify-content: center;

                gap: 2px;
            }

            .footer-text {
                display: none;
            }
        }

        /* =========================
           Responsive - Small Mobile
        ========================== */
        @media (max-width: 400px) {
            .brand-title {
                font-size: 0.92rem;
            }

            .page-title {
                font-size: 1.3rem;
            }

            .page-header {
                padding: 20px;
            }

            .page-header-icon {
                display: none;
            }

            .card {
                padding: 19px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         Header
    ========================== -->
    <header class="site-header">

        <div class="container navbar">

            <!-- Logo / Brand -->
            <a href="#" class="brand">

                <span class="brand-icon">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <rect x="4" y="3" width="16" height="18" rx="2"></rect>
                        <path d="M8 7h8"></path>
                        <path d="M8 11h8"></path>
                        <path d="M8 15h4"></path>
                        <circle cx="16.5" cy="15.5" r="1.5"></circle>
                    </svg>
                </span>

                <span class="brand-text">
                    <span class="brand-title">
                        دفترچه مخاطبین
                    </span>

                    <span class="brand-subtitle">
                        مدیریت ساده و سریع مخاطبین
                    </span>
                </span>

            </a>


            <!-- Navigation -->
            <nav class="nav-menu">

                <a href="#" class="nav-link active">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>

                    <span>مخاطبین</span>

                </a>

            </nav>


            <!-- Add Contact -->
            <a href="#" class="add-contact-btn">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M12 5v14"></path>
                    <path d="M5 12h14"></path>
                </svg>

                <span>افزودن مخاطب</span>

            </a>

        </div>

    </header>


    <!-- =========================
         Main Content
    ========================== -->
    <main>

        <div class="container main-content">

            <!-- Page Header -->
            <section class="page-header">

                <div class="page-header-content">

                    <div class="page-label">
                        <span class="page-label-dot"></span>
                        دفترچه شخصی شما
                    </div>

                    <h1 class="page-title">
                        مخاطبین
                    </h1>

                    <p class="page-description">
                        اطلاعات مخاطبین خود را در یک محیط ساده، مرتب و حرفه‌ای مدیریت کنید.
                    </p>

                </div>


                <div class="page-header-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle cx="9" cy="8" r="3"></circle>
                        <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path>
                        <path d="M17 11a3 3 0 1 0 0-6"></path>
                        <path d="M18 14.2c1.8.8 3 2.6 3 4.8"></path>
                    </svg>

                </div>

            </section>


            <!-- Search Area -->
            <section class="search-section">

                <div class="search-box">

                    <svg
                        class="search-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-4-4"></path>
                    </svg>

                    <input
                        type="text"
                        class="search-input"
                        placeholder="جستجوی نام، شماره تلفن یا ایمیل..."
                        aria-label="جستجوی مخاطبین"
                    >

                </div>

            </section>


            <!--
                فضای اصلی محتوای صفحات Django

                صفحات مختلف پروژه می‌توانند:
                - لیست مخاطبین
                - فرم افزودن مخاطب
                - فرم ویرایش
                - جزئیات مخاطب
                - پیام‌های موفقیت و خطا
                را در این بخش قرار دهند.
            -->

            <section class="content-section">

                {% block content %}
                {% endblock %}

            </section>

        </div>

    </main>
